# Cada lunes comprueba que las cámaras siguen respondiendo. Si alguna falla, el job sale en rojo
# y el resumen dice cuál: así se ve qué hay que arreglar en src/data/beaches.json.
name: Comprobar cámaras

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comprobar
        run: node scripts/check-cams.mjs | tee -a "$GITHUB_STEP_SUMMARY"
